# Netlify 배포 설정 — 빌드 과정 없이 폴더 그대로 올립니다.
[build]
  publish = "."
  command = ""

# 주소를 # 없이 입력해도 앱이 열리게 (예: dorantalk.com/push-setup → 앱이 #/push-setup 으로 바꿔 줌)
# 실제 파일이 있는 주소(js, css, 아이콘 등)는 그대로 그 파일을 보내요
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 보안 머리말
# - Content-Security-Policy: 우리 사이트 파일과 우리 Supabase 주소만 쓰도록 제한 (해킹 코드가 끼어들기 어렵게)
# - 다른 사이트가 TalkFeed를 몰래 틀 안에 넣지 못하게 (X-Frame-Options / frame-ancestors)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://jksstsimlqxleoerizzy.supabase.co; connect-src 'self' https://jksstsimlqxleoerizzy.supabase.co wss://jksstsimlqxleoerizzy.supabase.co; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# 코드가 바뀌면 휴대폰에서도 바로 새 버전을 받도록 (저장된 옛 파일 대신 서버 확인)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# 서비스 워커는 항상 최신으로 확인
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# 글꼴 파일은 바뀌지 않으니 1년 동안 저장
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 아이콘은 오래 저장해도 돼요
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
