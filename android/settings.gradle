// 도란톡 Android 앱 (Play 스토어용) — dorantalk.com 을 앱 화면으로 여는 TWA(Trusted Web Activity)
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'DoranTalk'
include ':app'
