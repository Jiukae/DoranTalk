plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dorantalk.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dorantalk.app'
        minSdk 24   // 안드로이드 7.0 이상 (androidbrowserhelper 2.7 이 요구)
        targetSdk 36
        // 새 APK 를 낼 때마다 versionCode 를 1씩 올려요 (같은 업로드 키로 서명해야 덮어 설치돼요)
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            // 쓰지 않는 코드 · 그림을 빼서 앱 크기를 줄여요
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 웹앱을 여는 껍데기라, 빌드를 막는 검사는 끄고 경고만 봐요
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
