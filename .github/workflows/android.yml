# 도란톡 Android 앱 (APK · AAB) 만들기 — 버전 2: 크롬 없이 앱 안의 화면(WebView) + Firebase 알림
# android/ 폴더가 바뀌거나, Actions 탭에서 "Run workflow" 를 누르면 실행돼요.
# 결과 파일은 실행 화면 아래 Artifacts 에서 받을 수 있어요.
#  - 저장소 Secrets 에 ANDROID_UPLOAD_KEYSTORE_B64 · ANDROID_UPLOAD_KEYSTORE_PASSWORD 가 있으면
#    업로드 키로 서명된 APK(바로 설치 · 덮어 설치)와 AAB(Play 스토어용)를 만들어요.
#  - 없으면 서명 안 된 파일만 만들어요. (설치하려면 서명이 필요해요)
#  - android/app/google-services.json 이 있으면 알림(Firebase)이 켜진 앱이 만들어져요.
name: Android 앱 (APK · AAB)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 앱 만들기 (APK · AAB · 시험용 디버그 APK)
        working-directory: android
        run: |
          [ -f app/google-services.json ] && echo "알림(Firebase) 켜진 앱" || echo "google-services.json 없음 → 알림 없이 만들어요"
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease assembleDebug

      - name: 업로드 키로 서명 (Secrets 가 있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/dorantalk-smoke.apk
          "$BT/zipalign" -p -f 4 "$APK" out/dorantalk-unsigned-aligned.apk
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-key-alias upload \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out out/dorantalk.apk out/dorantalk-unsigned-aligned.apk
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$RUNNER_TEMP/upload.jks" -storepass:env KEYSTORE_PASSWORD \
              -signedjar out/dorantalk.aab "$AAB" upload
            rm -f "$RUNNER_TEMP/upload.jks"
            "$BT/apksigner" verify --print-certs out/dorantalk.apk | grep -E "SHA-256|Signer"
            echo "SIGNED=yes"
          else
            cp "$AAB" out/dorantalk-unsigned.aab
            echo "SIGNED=no 서명 열쇠(Secrets)가 없어서 서명 안 된 파일만 만들었어요."
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dorantalk-smoke-apk
          path: out/dorantalk-smoke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dorantalk-apk
          path: |
            out/dorantalk.apk
            out/dorantalk-unsigned-aligned.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dorantalk-aab
          path: out/*.aab
          if-no-files-found: error

  # dorantalk.com 이 앱 서명 지문(assetlinks.json)을 제대로 내보내는지 확인해요 (주소창 숨기기에 필요)
  assetlinks-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 안드로이드 앱(APK) 내려받기 확인
        run: |
          # 사이트(www.dorantalk.com/download/dorantalk.apk)의 파일이 저장소의 download/dorantalk.apk 와 같은지 (배포가 늦으면 3분까지 기다려요)
          WANT=$(sha256sum download/dorantalk.apk | cut -d' ' -f1)
          for i in $(seq 1 18); do
            curl -sS -D headers.txt -o site.apk https://www.dorantalk.com/download/dorantalk.apk || true
            GOT=$(sha256sum site.apk | cut -d' ' -f1)
            [ "$GOT" = "$WANT" ] && break
            sleep 10
          done
          grep -iE '^(HTTP|content-type|content-disposition|cache-control)' headers.txt
          echo "저장소 $WANT"; echo "사이트 $GOT"
          [ "$GOT" = "$WANT" ] || { echo "사이트의 APK 가 저장소와 달라요"; exit 1; }
          echo "OK APK 같음"
          grep -qi 'application/vnd.android.package-archive' headers.txt || { echo "내려받기 형식(Content-Type)이 달라요"; exit 1; }
          echo "OK 내려받기 형식"

      - name: assetlinks.json 확인
        run: |
          # dorantalk.com 은 www.dorantalk.com 으로 넘어가요(308). 앱은 www 주소를 열어요.
          for u in https://dorantalk.com/.well-known/assetlinks.json https://www.dorantalk.com/.well-known/assetlinks.json; do
            echo "=== $u"
            curl -sS -o /dev/null -D - "$u" | grep -iE '^(HTTP|location|content-type)' || true
          done
          echo "--- Google Digital Asset Links API (www.dorantalk.com) ---"
          curl -fsS "https://digitalassetlinks.googleapis.com/v1/statements:list?source.web.site=https://www.dorantalk.com&relation=delegate_permission/common.handle_all_urls" | tee dal.json | head -c 1500; echo
          # www 주소에서 리다이렉트 없이 바로 JSON 이 오고, Google 도 com.dorantalk.app 을 읽어야 해요
          curl -fsS --max-redirs 0 https://www.dorantalk.com/.well-known/assetlinks.json | python3 -c "import json,sys; d=json.load(sys.stdin); t=d[0]['target']; assert t['package_name']=='com.dorantalk.app'; print('OK 지문', len(t['sha256_cert_fingerprints']), '개')"
          grep -q 'com.dorantalk.app' dal.json || { echo "Google 이 앱 지문을 못 읽었어요"; exit 1; }
          echo "OK Google 확인"

  # 에뮬레이터(안드로이드 16)에서 크롬을 끈 채로 설치 · 실행해 보고, 알림이 위에 팝업으로 뜨는지 화면을 찍어요
  smoke-test:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dorantalk-smoke-apk
          path: apk
      - name: KVM 켜기 (에뮬레이터 속도)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: |
            smoke.png
            popup.png
          if-no-files-found: ignore

  # 서명된(없으면 서명 안 된) APK 를 글자(base64)로 로그에 적어 둬요.
  # Artifacts 를 내려받을 수 없는 곳(예: Claude 작업 환경)에서 이 로그만 읽어 파일을 되살릴 수 있게.
  export-log:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dorantalk-apk
      - name: APK 를 base64 로 출력
        run: |
          F=dorantalk.apk
          [ -f "$F" ] || F=dorantalk-unsigned-aligned.apk
          echo "APK_FILE $F"
          echo "APK_SHA256 $(sha256sum "$F" | cut -d' ' -f1)"
          echo "APK_BEGIN"
          base64 -w 3000 "$F"
          echo "APK_END"
