# 도란톡 Android 앱(AAB) 만들기
# android/ 폴더가 바뀌거나, Actions 탭에서 "Run workflow" 를 누르면 실행돼요.
# 결과 파일은 실행 화면 아래 Artifacts 에서 받을 수 있어요.
#  - 저장소 Secrets 에 ANDROID_UPLOAD_KEYSTORE_B64 · ANDROID_UPLOAD_KEYSTORE_PASSWORD 가 있으면
#    업로드 키로 서명된 AAB(Play 스토어에 바로 올릴 수 있는 파일)를 만들어요.
#  - 없으면 서명 안 된 AAB 만 만들어요.
name: Android 앱 (AAB)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: AAB 만들기
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease

      - name: 시험용 APK 만들기 (에뮬레이터 실행 시험용 · 임시 열쇠로 서명)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass smoketest -keypass smoketest \
            -alias smoke -keyalg RSA -keysize 2048 -validity 2 -dname CN=smoke > /dev/null 2>&1
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:smoketest --out apk/dorantalk-smoke.apk "$RUNNER_TEMP/aligned.apk"
          ls -la apk android/app/build/outputs/bundle/release

      - uses: actions/upload-artifact@v4
        with:
          name: dorantalk-smoke-apk
          path: apk/*.apk

      - name: 라이브러리 정보 (문제 생겼을 때 참고용)
        continue-on-error: true
        run: |
          curl -fsS https://dl.google.com/android/maven2/com/google/androidbrowserhelper/androidbrowserhelper/maven-metadata.xml | grep -oE '<version>[^<]+' | tail -5 || true
          AAR=$(find ~/.gradle/caches -name 'androidbrowserhelper-*.aar' | head -1)
          echo "$AAR"
          if [ -n "$AAR" ]; then unzip -p "$AAR" classes.jar > "$RUNNER_TEMP/abh.jar" && unzip -l "$RUNNER_TEMP/abh.jar" | grep -E 'trusted/(LauncherActivity|ManageDataLauncherActivity|FocusActivity|WebViewFallbackActivity|NotificationPermissionRequestActivity|DelegationService|NotificationDelegationExtraCommandHandler)\.class' || true; fi

      - name: 업로드 키로 서명 (Secrets 가 있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$RUNNER_TEMP/upload.jks" -storepass:env KEYSTORE_PASSWORD \
              -signedjar out/dorantalk.aab "$AAB" upload
            rm -f "$RUNNER_TEMP/upload.jks"
            jarsigner -verify out/dorantalk.aab | tail -1
          else
            cp "$AAB" out/dorantalk-unsigned.aab
            echo "서명 열쇠가 없어서 서명 안 된 AAB 를 만들었어요."
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dorantalk-aab
          path: out/*.aab
          if-no-files-found: error

  # 에뮬레이터(안드로이드 14 + 크롬)에서 설치 · 실행해 보고 화면을 찍어요
  smoke-test:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dorantalk-smoke-apk
          path: apk
      - name: KVM 켜기 (에뮬레이터 속도)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

  # 서명 안 된 AAB 를 글자(base64)로 로그에 적어 둬요.
  # Artifacts 를 내려받을 수 없는 곳(예: Claude 작업 환경)에서 이 로그만 읽어 파일을 되살릴 수 있게.
  export-log:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dorantalk-aab
      - name: AAB 를 base64 로 출력
        run: |
          F=$(ls *.aab | head -1)
          echo "AAB_FILE $F"
          echo "AAB_SHA256 $(sha256sum "$F" | cut -d' ' -f1)"
          echo "AAB_BEGIN"
          base64 -w 3000 "$F"
          echo "AAB_END"
